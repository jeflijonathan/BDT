      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret

    volumes:
      - minio4_data:/data

    command: >
      server
      http://minio1/data
      http://minio2/data
      http://minio3/data
      http://minio4/data
      --console-address ":9001"

    networks:
      - docker_network

volumes:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data:

networks:
  docker_network:
    driver: bridge