services:
  minio1:
    container_name: minio1
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret

    volumes:
      - ./minio1:/data

    command: >
      server
      http://minio1/data
      http://minio2/data
      http://minio3/data
      http://minio4/data
      --console-address ":9001"

    networks:
      - docker_network

  minio2:
    container_name: minio2
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret

    volumes:
      - ./minio2:/data

    command: >
      server
      http://minio1/data
      http://minio2/data
      http://minio3/data
      http://minio4/data
      --console-address ":9001"

    networks:
      - docker_network

  minio3:
    container_name: minio3
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret

    volumes:
      - ./minio3:/data

    command: >
      server
      http://minio1/data
      http://minio2/data
      http://minio3/data
      http://minio4/data
      --console-address ":9001"

    networks:
      - docker_network

  minio4:
    container_name: minio4
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret

    volumes:
      - ./minio4:/data

    command: >
      server
      http://minio1/data
      http://minio2/data
      http://minio3/data
      http://minio4/data
      --console-address ":9001"

    networks:
      - docker_network

volumes:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data:

networks:
  docker_network:
    driver: bridge
