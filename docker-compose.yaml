services:
  minio1:
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret

    volumes:
      - minio1_data:/data

    command: >
      server
      http://minio1/data
      http://minio2/data
      http://minio3/data
      http://minio4/data
      --console-address ":9001"

    networks:
      - docker_network

  minio2:
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret

    volumes:
      - minio2_data:/data

    command: >
      server
      http://minio1/data
      http://minio2/data
      http://minio3/data
      http://minio4/data
      --console-address ":9001"

    networks:
      - docker_network

  minio3:
